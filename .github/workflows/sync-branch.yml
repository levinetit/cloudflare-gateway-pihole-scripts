name: Sync branch

on:
  push:
    branches:
      - main

jobs:
  sync-branch:
    name: Update v1 branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Rulează doar pe acest repo (fork-ul levinetit), nu pe alte fork-uri
    if: ${{ github.repository_id == 750577776 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      # v1 = copie exactă a lui main (force push) până la breaking changes.
      # Înlocuit connor-baer/action-sync-branch@v1.1.1 (node20) cu git direct.
      - name: Sincronizează v1 cu main
        run: git push --force origin HEAD:refs/heads/v1
